<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  <defs>
    <filter id="sblur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="sblur2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="sblur3" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="spaper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="t">
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
      <feComposite in="t" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="swash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DDCE" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#E4DDCE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E4DDCE" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sjadewash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6E8E1" stop-opacity="0"/>
      <stop offset="1" stop-color="#D6E8E1" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="sbrasswash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EDE2C9" stop-opacity="0"/>
      <stop offset="1" stop-color="#EDE2C9" stop-opacity="0.85"/>
    </linearGradient>
  </defs><rect width="1600" height="1000" fill="#F7F4EC"/><rect width="1600" height="1000" fill="#F7F4EC" filter="url(#spaper)" opacity="0.9"/><ellipse cx="400" cy="500" rx="460" ry="460" fill="#D6E8E1" opacity="0.45" filter="url(#sblur3)"/><ellipse cx="1200" cy="500" rx="460" ry="460" fill="#EDE2C9" opacity="0.45" filter="url(#sblur3)"/><text x="800.0" y="86" text-anchor="middle" font-size="34" fill="#1C2624" font-family="serif" letter-spacing="14">双 轨 纪 年</text><text x="800.0" y="122" text-anchor="middle" font-size="12" fill="#5A6B66" font-family="serif" letter-spacing="6">纪元 1521 — 至今</text><text x="400" y="186" text-anchor="middle" font-size="17" fill="#2E7D6E" font-family="serif" letter-spacing="6">东 · 青鸾执月</text><text x="1200" y="186" text-anchor="middle" font-size="17" fill="#9A7B3F" font-family="serif" letter-spacing="6">西 · 铜律锁星</text><line x1="800" y1="210" x2="800" y2="930" stroke="#1C2624" stroke-width="1.2" opacity="0.35"/><text x="800" y="236.0" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1521</text><circle cx="800" cy="230.0" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="230.0" x2="730" y2="230.0" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="236.0" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">青鸾衔月出痕，月升于天</text><line x1="814" y1="230.0" x2="870" y2="230.0" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="236.0" font-size="15" fill="#3A4A46" font-family="serif">界痕闭合，编号体系失据</text><text x="800" y="334.57142857142856" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1522</text><circle cx="800" cy="328.57142857142856" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="328.57142857142856" x2="730" y2="328.57142857142856" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="334.57142857142856" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">玄洲人抬头，不敢称月</text><line x1="814" y1="328.57142857142856" x2="870" y2="328.57142857142856" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="334.57142857142856" font-size="15" fill="#3A4A46" font-family="serif">第一批被除名者回流</text><text x="800" y="433.1428571428571" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1524</text><circle cx="800" cy="427.1428571428571" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="427.1428571428571" x2="730" y2="427.1428571428571" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="433.1428571428571" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">追月者结社，云岫立誓</text><line x1="814" y1="427.1428571428571" x2="870" y2="427.1428571428571" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="433.1428571428571" font-size="15" fill="#3A4A46" font-family="serif">帝国颁布《回流禁令》</text><text x="800" y="531.7142857142858" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1526</text><circle cx="800" cy="525.7142857142858" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="525.7142857142858" x2="730" y2="525.7142857142858" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="531.7142857142858" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">云岫绘成《月行图》初稿</text><line x1="814" y1="525.7142857142858" x2="870" y2="525.7142857142858" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="531.7142857142858" font-size="15" fill="#3A4A46" font-family="serif">锁星阵启动，夜空划格</text><text x="800" y="630.2857142857142" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1529</text><circle cx="800" cy="624.2857142857142" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="624.2857142857142" x2="730" y2="624.2857142857142" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="630.2857142857142" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">月被命名「执月」</text><line x1="814" y1="624.2857142857142" x2="870" y2="624.2857142857142" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="630.2857142857142" font-size="15" fill="#3A4A46" font-family="serif">月被编号 ORI-0001</text><text x="800" y="728.8571428571429" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1531</text><circle cx="800" cy="722.8571428571429" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="722.8571428571429" x2="730" y2="722.8571428571429" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="728.8571428571429" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">阿鸾第一次开口</text><line x1="814" y1="722.8571428571429" x2="870" y2="722.8571428571429" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="728.8571428571429" font-size="15" fill="#3A4A46" font-family="serif">第七十二自陈其名</text><text x="800" y="827.4285714285714" text-anchor="middle" font-size="20" fill="#1C2624" font-family="serif" letter-spacing="2">1533</text><circle cx="800" cy="821.4285714285714" r="5" fill="#F7F4EC" stroke="#1C2624" stroke-width="2"/><line x1="786" y1="821.4285714285714" x2="730" y2="821.4285714285714" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="827.4285714285714" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">无名拒绝填碑第四字</text><line x1="814" y1="821.4285714285714" x2="870" y2="821.4285714285714" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="827.4285714285714" font-size="15" fill="#3A4A46" font-family="serif">塞维鲁写满第十七面墙</text><text x="800" y="926.0" text-anchor="middle" font-size="20" fill="#B04A38" font-family="serif" letter-spacing="2">至今</text><circle cx="800" cy="920.0" r="7" fill="#F7F4EC" stroke="#B04A38" stroke-width="2"/><circle cx="800" cy="920.0" r="14" fill="none" stroke="#B04A38" stroke-width="1" opacity="0.5"/><line x1="786" y1="920.0" x2="730" y2="920.0" stroke="#2E7D6E" stroke-width="1" opacity="0.5"/><text x="716" y="926.0" text-anchor="end" font-size="15" fill="#3A4A46" font-family="serif">月仍在天上，仍在移动</text><line x1="814" y1="920.0" x2="870" y2="920.0" stroke="#9A7B3F" stroke-width="1" opacity="0.5"/><text x="884" y="926.0" font-size="15" fill="#3A4A46" font-family="serif">星仍在移动，编号仍在</text><rect x="470" y="594.2857142857142" width="660" height="60" fill="none" stroke="#B04A38" stroke-width="1" stroke-dasharray="6 6" opacity="0.45" rx="4"/><text x="800" y="676.2857142857142" text-anchor="middle" font-size="11" fill="#B04A38" font-family="serif" letter-spacing="3" opacity="0.8">同一物 · 两种叙述</text><text x="800.0" y="972" text-anchor="middle" font-size="12" fill="#8A9994" font-family="serif" letter-spacing="2">两条线从不交叉，只在 1529 并置</text></svg>